name: Crawl 3D Print News & Videos
on:
  schedule:
    - cron: '0 6 * * *' # UTC时间早上6点，对应国内下午14点，每天一次
  workflow_dispatch: # 支持手动点按钮立即跑一次测试

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install rss-parser axios
      - name: Run crawler
        run: node crawl.js
      - name: Commit data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "auto update news & videos" || echo "no change"
          git push
